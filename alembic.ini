[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./agentflow.db

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_alembic]
level = INFO
handlers = console
qualname = alembic.runtime.logger
propagate = True

[logger_root]
level = INFO
handlers = console
qualname = root
